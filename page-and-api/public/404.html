    <title>Nothing at this address — Copperline Press</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #17181c;
        --paper: #fbf8f3;
        --accent: #8c3b1e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f2efe9;
          --paper: #16171a;
          --accent: #e08a5f;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font: 17px/1.6 ui-serif, Georgia, "Times New Roman", serif;
        text-align: center;
      }
      main {
        padding: 2rem;
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 0.5rem;
      }
      a {
        color: var(--accent);
      }
