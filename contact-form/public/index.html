<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Fernhill Garden Design</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1b1f1c;
        --paper: #f7f8f4;
        --rule: #c9cfc4;
        --accent: #2f6b45;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #eef1ec;
          --paper: #151816;
          --rule: #3a403b;
          --accent: #7fc79a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 17px/1.6 system-ui, sans-serif;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: 3rem 1.5rem;
      }
      h1 {
        font-size: 2rem;
        line-height: 1.2;
        margin: 0 0 0.5rem;
      }
      label {
        display: block;
        font-weight: 600;
        margin-top: 1.25rem;
      }
      input,
      textarea {
        display: block;
        width: 100%;
        margin-top: 0.35rem;
        padding: 0.6rem;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--rule);
        border-radius: 4px;
      }
      .sent {
        display: none;
        border: 2px solid var(--accent);
        border-radius: 4px;
        padding: 1rem;
        margin: 1.5rem 0;
      }
      .sent:target {
        display: block;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.7rem 1.4rem;
        font: inherit;
        font-weight: 600;
        color: var(--paper);
        background: var(--accent);
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Talk to us about your garden</h1>
      <p>Tell us a little about the space and what you would like from it. We reply to every message ourselves.</p>
      <p class="sent" id="sent" role="status">
        Thank you. Your message has reached us, and we will reply within two working days.
      </p>
      <form method="post" action="">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" autocomplete="name" maxlength="200" required />
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" spellcheck="false" maxlength="320" required />
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" maxlength="5000" required></textarea>
        <button type="submit">Send message</button>
      </form>
    </main>
  </body>
</html>
